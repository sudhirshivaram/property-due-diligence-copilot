[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "property-due-diligence-copilot"
version = "0.1.0"
description = "Notebook-first property document due diligence"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7", "python-docx>=1.2,<2"]

[project.optional-dependencies]
dev = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "ipykernel>=6,<8", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
